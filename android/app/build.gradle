plugins {
    id "com.android.application"
}

android {
    namespace "dev.ultra.launcher"
    compileSdk 35

    defaultConfig {
        applicationId "dev.ultra.launcher"
        minSdk 26
        targetSdk 35
        // CI passes -PversionCode=<workflow run number>; the in-app updater compares it
        // with the versionCode in the launcher-latest release's version.json.
        versionCode((project.findProperty("versionCode") ?: "1") as Integer)
        versionName("0.1." + versionCode)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        // The home screen UI is the ultra app in web/, served from assets.
        main.assets.srcDirs = ["$rootDir/../web"]
    }

    androidResources {
        // app.py is the LPython source; apps.json and widgets.json are the browser demo's stand-ins.
        ignoreAssetsPattern = "!app.py:!apps.json:!widgets.json:!__pycache__:!.*"
    }

    signingConfigs {
        // One committed debug key, so every CI build installs over the last one.
        // (A fresh runner would otherwise sign with a newly generated debug key.)
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
}
