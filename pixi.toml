[workspace]
name = "launcher"
description = "Android home-screen launcher written as an ultra app (LPython -> wasm)"
channels = ["https://conda.anaconda.org/conda-forge", "https://prefix.dev/nandi-testing"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

# ultra (the framework and its `ultra` build CLI, with lpython) comes from prefix.dev/nandi-testing.
[dependencies]
python = "3.12.*"
ultra = ">=0.1.19"
nodejs = ">=22"

[tasks]
build = { cmd = "ultra build web/app.py", description = "Compile web/app.py to web/app.wasm" }
serve = { cmd = "ultra serve web", description = "Serve the launcher's browser demo on http://localhost:8000" }
install-playwright = { cmd = "npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium", description = "Fetch Playwright and Chromium for the browser test" }
test = { cmd = "python tests/run.py", depends-on = ["build"], description = "Build, then run the browser test against a local server" }
