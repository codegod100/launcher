# fileapi forge CI (https://fileapi.fastapicloud.dev/forge/nandi.uk/launcher).
# The forge follows GitHub's main (below), so a commit to either one builds the Qt APK on
# Depot and publishes it as a release here, which the phone's updater reads
# (releases/latest/assets/version.json). Needs DEPOT_TOKEN and DEPOT_PROJECT_ID (user secrets).

[upstream]
url = "https://github.com/codegod100/launcher.git"
branches = ["main"]
interval = 60

[[job]]
name = "apk"
branches = ["main"]
timeout = 3600
image = "eclipse-temurin:17-jdk-noble"
run = "bash ci/forge-apk.sh"
